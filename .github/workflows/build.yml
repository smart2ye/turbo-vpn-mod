name: Build Turbo VPN Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool
        run: sudo apt update && sudo apt install -y apktool

      - name: Nuke all problematic resources
        run: |
          echo "🔥 حذف كل الملفات المسببة للمشاكل..."
          
          # 1. حذف كل ملفات drawable التي تحتوي على $ أو تشير إلى إعلانات
          find res/drawable -type f \( -name "*\$*.xml" -o -name "tp_*.xml" -o -name "zab_*.xml" -o -name "zui_*.xml" -o -name "zs_*.xml" -o -name "mtrl_*.xml" -o -name "avd_*.xml" -o -name "design_password_eye.xml" -o -name "always_on_*.xml" -o -name "add_dns_*.xml" \) -delete 2>/dev/null || true

          # 2. حذف كل ملفات layout التي تحتوي على إشارات لإعلانات
          find res/layout -type f \( -name "tp_*.xml" -o -name "zab_*.xml" -o -name "zui_*.xml" -o -name "zs_*.xml" -o -name "sub_*.xml" -o -name "layout_subs_*.xml" -o -name "mtrl_*.xml" -o -name "material_*.xml" -o -name "notification_*.xml" -o -name "server_list_*.xml" -o -name "*_ad_*.xml" \) -delete 2>/dev/null || true

          # 3. حذف كل ملفات menu التي تحتوي على إعلانات
          find res/menu -type f \( -name "tp_*.xml" -o -name "zab_*.xml" -o -name "zui_*.xml" -o -name "zs_*.xml" -o -name "*ad*.xml" -o -name "*Ad*.xml" \) -delete 2>/dev/null || true

          # 4. حذف أي ملف ic_launcher.xml (تعارض)
          find res/ -type f -name "ic_launcher.xml" -delete

          # 5. حذف ids.xml و public.xml
          rm -f res/values/ids.xml res/values/public.xml

          # 6. حذف أي ملف layout أو drawable يشير إلى $ (حتى لو لم يتم تغطيته أعلاه)
          find res/ -type f -name "*.xml" -exec grep -l "\\$" {} \; -delete 2>/dev/null || true

          echo "✅ تم حذف كل الموارد المسببة للمشاكل"

      - name: Build APK
        run: apktool b . -o app-unsigned.apk -f --no-crunch

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore my.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 -dname "CN=VPN"
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 app-unsigned.apk
          mv app-unsigned.apk turbo_vpn_mod.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboVPN-Mod
          path: turbo_vpn_mod.apk
