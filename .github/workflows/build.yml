name: Build Turbo VPN Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool
        run: |
          sudo apt update
          sudo apt install -y apktool

      - name: Clean all problematic resource files
        run: |
          # حذف جميع ملفات ic_launcher (XML و PNG) من كل مجلدات mipmap
          find res/ -type f \( -name "ic_launcher.xml" -o -name "ic_launcher.png" -o -name "ic_launcher_round.xml" -o -name "ic_launcher_round.png" \) -delete

          # حذف ids.xml و public.xml
          rm -f res/values/ids.xml res/values/public.xml

          # حذف جميع الملفات التي تحتوي على $ في اسمها (أسماء غير صالحة)
          find res/drawable -type f -name '*\$*.xml' -delete 2>/dev/null || true
          find res/drawable-* -type f -name '*\$*.xml' -delete 2>/dev/null || true

          # حذف أي ملفات أخرى غير مرغوب فيها
          find res/ -type f \( -name "add_dns_*.xml" -o -name "always_on_step*.xml" -o -name "zs_*.xml" -o -name "zui_*.xml" -o -name "avd_*.xml" -o -name "design_password_eye.xml" -o -name "abc_btn_*.xml" \) -delete 2>/dev/null || true

          # حذف المجلدات الفارغة
          find res/ -type d -empty -delete 2>/dev/null || true

          echo "✅ تم تنظيف جميع الموارد المسببة للمشاكل"

      - name: Build APK
        run: |
          apktool b . -o app-unsigned.apk -f --no-crunch

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore my.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=VPN"
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 app-unsigned.apk
          mv app-unsigned.apk turbo_vpn_mod.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboVPN-Mod
          path: turbo_vpn_mod.apk
