name: Build Turbo VPN Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool
        run: |
          sudo apt update
          sudo apt install -y apktool

      - name: Clean problematic layout files
        run: |
          # حذف ملفات الـ layout التي تسبب أخطاء مراجع غير موجودة
          rm -f res/layout/sub_active_template_2.xml
          rm -f res/layout/test_action_chip.xml
          rm -f res/layout/test_design_checkbox.xml
          rm -f res/layout/test_navigation_bar_item_layout.xml
          # حذف أي ملفات أخرى تحوي "test" في الاسم (غالباً اختبارية)
          find res/layout -type f -name "*test*.xml" -delete 2>/dev/null || true
          echo "✅ تم حذف ملفات الـ layout المخالفة"

      - name: Build APK
        run: |
          apktool b . -o app-unsigned.apk -f --no-crunch

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore my.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=VPN"
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 app-unsigned.apk
          mv app-unsigned.apk turbo_vpn_mod.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboVPN-Mod
          path: turbo_vpn_mod.apk
