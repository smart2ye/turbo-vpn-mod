name: Build Turbo VPN Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool
        run: |
          sudo apt update
          sudo apt install -y apktool

      - name: Remove all problematic files
        run: |
          # 1. حذف جميع ملفات drawable التي تحتوي على $ في الاسم
          find res/drawable* -type f -name '*\$*.xml' -delete 2>/dev/null || true

          # 2. حذف الملفات التي تشير إلى موارد محذوفة (add_dns, always_on, design_password_eye)
          find res/drawable* -type f \( -name "add_dns_*.xml" -o -name "always_on_*.xml" -o -name "design_password_eye.xml" \) -delete 2>/dev/null || true

          # 3. حذف ملفات zui_, zs_, avd_ (خاصة بالدعم الفني والرسوم المتحركة)
          find res/drawable* -type f \( -name "zui_*" -o -name "zs_*" -o -name "avd_*" \) -delete 2>/dev/null || true

          # 4. حذف ملفات ic_launcher من mipmap
          find res/mipmap* -type f -name "ic_launcher*.xml" -delete 2>/dev/null || true

          # 5. حذف ids.xml و public.xml
          rm -f res/values/ids.xml res/values/public.xml

          # 6. حذف مجلد menu بالكامل (غير ضروري ويسبب مراجع مفقودة)
          rm -rf res/menu

          # 7. حذف ملفات layout الاختبارية أو التي تبدأ بـ zui_, zs_
          find res/layout -type f \( -name "*test*.xml" -o -name "zui_*" -o -name "zs_*" \) -delete 2>/dev/null || true

          echo "✅ تم تنظيف جميع الملفات المخالفة"

      - name: Build APK
        run: |
          apktool b . -o app-unsigned.apk -f --no-crunch

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore my.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=VPN"
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 app-unsigned.apk
          mv app-unsigned.apk turbo_vpn_mod.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboVPN-Mod
          path: turbo_vpn_mod.apk
