name: Build Turbo VPN Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool
        run: sudo apt update && sudo apt install -y apktool

      - name: Aggressive cleanup of problematic resources
        run: |
          # 1. حذف جميع المجلدات الفرعية للـ layout و drawable (ما عدا الرئيسية)
          find res/ -maxdepth 1 -type d \( -name "layout-*" -o -name "drawable-*" \) -exec rm -rf {} + || true

          # 2. حذف أي ملف يحتوي على $ في اسمه
          find res/ -type f -name "*\$*.xml" -delete || true

          # 3. حذف ids.xml و public.xml
          rm -f res/values/ids.xml res/values/public.xml || true

          # 4. حذف جميع ملفات tp_* و zab_* و sub_* و layout_subs_* (مرتبطة بإعلانات واشتراكات)
          find res/layout -type f \( -name "tp_*.xml" -o -name "zab_*.xml" -o -name "sub_*.xml" -o -name "layout_subs_*.xml" \) -delete || true
          find res/drawable -type f \( -name "tp_*.xml" -o -name "zab_*.xml" -o -name "sub_*.xml" -o -name "layout_subs_*.xml" \) -delete || true
          find res/menu -type f \( -name "tp_*.xml" -o -name "zab_*.xml" -o -name "sub_*.xml" -o -name "layout_subs_*.xml" \) -delete || true

          # 5. حذف ملفات material, mtrl, notification (من مكتبات Material Design والإشعارات)
          find res/layout -type f -name "material_*.xml" -delete || true
          find res/layout -type f -name "mtrl_*.xml" -delete || true
          find res/layout -type f -name "notification_*.xml" -delete || true
          find res/drawable -type f -name "material_*.xml" -delete || true
          find res/drawable -type f -name "mtrl_*.xml" -delete || true
          find res/drawable -type f -name "notification_*.xml" -delete || true

          # 6. حذف ملفات server_list_* (تخطيطات قائمة الخوادم التي قد تسبب أخطاء)
          find res/layout -type f -name "server_list_*.xml" -delete || true
          find res/layout -type f -name "layout_vpn_notification.xml" -delete || true

          echo "✅ تم التنظيف الشامل لجميع الموارد المسببة للمشاكل"

      - name: Build APK with aggressive cleanup
        run: |
          apktool b . -o app-unsigned.apk -f --no-crunch

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore my.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 -dname "CN=VPN"
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 app-unsigned.apk
          mv app-unsigned.apk turbo_vpn_mod.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboVPN-Mod
          path: turbo_vpn_mod.apk
